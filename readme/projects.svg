<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">Selected projects</title>
  <desc id="desc">Aeroguard, InvenioAI, and Amon Hen.</desc>
  <defs>
    <style><![CDATA[
      .paper { fill: #f7f6f2; }
      .ink { fill: #171817; }
      .muted { fill: #65645e; }
      .rule { stroke: #d9d7cf; }
      .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
      .label { font-size: 12px; letter-spacing: 1.5px; }
      .heading { font-size: 38px; font-weight: 500; letter-spacing: -2px; }
      .index { font-size: 13px; letter-spacing: 1px; }
      .name { font-size: 22px; font-weight: 550; letter-spacing: -.5px; }
      .kind { font-size: 11px; letter-spacing: 1px; }
      .description { font-size: 15px; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #101110; }
        .ink { fill: #f1f0ec; }
        .muted { fill: #aaa9a1; }
        .rule { stroke: #343530; }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="470" class="paper" />
  <text x="72" y="58" class="mono muted label">01 / SELECTED WORK</text>
  <text x="72" y="108" class="sans ink heading">Projects</text>
  <line x1="72" y1="132" x2="1128" y2="132" class="rule" stroke-width="1" />

  <text x="72" y="190" class="mono muted index">01</text>
  <text x="142" y="190" class="sans ink name">Aeroguard</text>
  <text x="142" y="215" class="mono muted kind">INDUSTRIAL AI / PREDICTIVE MAINTENANCE</text>
  <text x="600" y="190" class="sans muted description">Plant telemetry, persistent anomaly alerts,</text>
  <text x="600" y="213" class="sans muted description">and equipment breach forecasts.</text>
  <line x1="72" y1="240" x2="1128" y2="240" class="rule" stroke-width="1" />

  <text x="72" y="298" class="mono muted index">02</text>
  <text x="142" y="298" class="sans ink name">InvenioAI</text>
  <text x="142" y="323" class="mono muted kind">GENERATIVE AI / HYBRID RAG</text>
  <text x="600" y="298" class="sans muted description">PDF question answering with hybrid retrieval,</text>
  <text x="600" y="321" class="sans muted description">RAG Fusion, and cross-encoder reranking.</text>
  <line x1="72" y1="348" x2="1128" y2="348" class="rule" stroke-width="1" />

  <text x="72" y="388" class="mono muted index">03</text>
  <text x="142" y="388" class="sans ink name">Amon Hen</text>
  <text x="142" y="413" class="mono muted kind">DEVELOPER TOOLS / ONNX</text>
  <text x="600" y="388" class="sans muted description">CPU-native search across local video</text>
  <text x="600" y="411" class="sans muted description">and spoken dialogue.</text>
  <line x1="72" y1="438" x2="1128" y2="438" class="rule" stroke-width="1" />
</svg>
