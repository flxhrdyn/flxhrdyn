<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 435" role="img" aria-labelledby="title desc">
  <title id="title">Selected experience</title>
  <desc id="desc">Current and recent data and AI engineering roles.</desc>
  <defs>
    <style><![CDATA[
      .paper { fill: #f7f6f2; }
      .ink { fill: #171817; }
      .muted { fill: #65645e; }
      .rule { stroke: #d9d7cf; }
      .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
      .label { font-size: 12px; letter-spacing: 1.5px; }
      .heading { font-size: 38px; font-weight: 500; letter-spacing: -2px; }
      .date { font-size: 12px; }
      .role { font-size: 18px; font-weight: 550; }
      .company { font-size: 14px; }
      .detail { font-size: 14px; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #101110; }
        .ink { fill: #f1f0ec; }
        .muted { fill: #aaa9a1; }
        .rule { stroke: #343530; }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="435" class="paper" />
  <text x="72" y="58" class="mono muted label">02 / EXPERIENCE</text>
  <text x="72" y="108" class="sans ink heading">Selected experience</text>
  <line x1="72" y1="132" x2="1128" y2="132" class="rule" stroke-width="1" />

  <text x="72" y="182" class="mono muted date">SEP 2026 — PRESENT</text>
  <text x="330" y="180" class="sans ink role">Data Analyst Intern</text>
  <text x="330" y="204" class="sans muted company">PT Tunas Ridean Tbk</text>
  <text x="710" y="180" class="sans muted detail">Automating sales, inventory, and aftersales</text>
  <text x="710" y="202" class="sans muted detail">analysis across dealership networks.</text>
  <line x1="72" y1="226" x2="1128" y2="226" class="rule" stroke-width="1" />

  <text x="72" y="276" class="mono muted date">SEP 2024 — PRESENT</text>
  <text x="330" y="274" class="sans ink role">AI Engineer (part-time)</text>
  <text x="330" y="298" class="sans muted company">HPC Universitas Gunadarma</text>
  <text x="710" y="274" class="sans muted detail">Built a RAG lab assistant and deployed</text>
  <text x="710" y="296" class="sans muted detail">distributed workloads on NVIDIA DGX.</text>
  <line x1="72" y1="320" x2="1128" y2="320" class="rule" stroke-width="1" />

  <text x="72" y="370" class="mono muted date">JUN — SEP 2026</text>
  <text x="330" y="368" class="sans ink role">Data Scientist Intern</text>
  <text x="330" y="392" class="sans muted company">PT Astra Visteon Indonesia</text>
  <text x="710" y="368" class="sans muted detail">Predictive maintenance across 150K+ records;</text>
  <text x="710" y="390" class="sans muted detail">critical-event recall improved from 0% to 60%.</text>
  <line x1="72" y1="408" x2="1128" y2="408" class="rule" stroke-width="1" />
</svg>
