  <defs>
    <style><![CDATA[
      .paper { fill: #f7f6f2; }
      .ink { fill: #171817; }
      .muted { fill: #65645e; }
      .rule { stroke: #d9d7cf; }
      .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
      .eyebrow { font-size: 13px; letter-spacing: 1.5px; }
      .meta { font-size: 11px; letter-spacing: 1px; }
      .name { font-size: 58px; font-weight: 550; letter-spacing: -3.3px; }
      .body { font-size: 16px; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #101110; }
        .ink { fill: #f1f0ec; }
