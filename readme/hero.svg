      .ascii { fill: #65645e; font: 10px/8px "Geist Mono", Consolas, monospace; letter-spacing: 1px; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #101110; }
        .ink { fill: #f1f0ec; }
        .muted { fill: #aaa9a1; }
        .ascii { fill: #aaa9a1; }
      }
    ]]></style>
