  <text x="840" y="58" text-anchor="end" class="mono muted meta">JAKARTA, INDONESIA</text>
  <text x="60" y="143" class="sans ink name">Felix Windriyareksa</text>
  <text x="60" y="210" class="sans ink name">Hardyan</text>
  <text x="60" y="258" class="sans muted body">AI/ML Engineer building production AI systems, deep learning architectures,</text>
