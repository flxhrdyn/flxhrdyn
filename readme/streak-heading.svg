<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" role="img" aria-labelledby="title">
  <title id="title">GitHub activity and streak</title>
  <defs>
    <style><![CDATA[
      .paper { fill: #f7f6f2; }
      .ink { fill: #171817; }
      .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .heading { font-size: 32px; font-weight: 600; letter-spacing: -1.5px; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #101110; }
        .ink { fill: #f1f0ec; }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="80" class="paper" />
  <text x="72" y="52" class="sans ink heading">GitHub activity &amp; streak</text>
</svg>
