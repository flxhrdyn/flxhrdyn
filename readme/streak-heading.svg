<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" role="img" aria-labelledby="title">
  <title id="title">GitHub activity and streak</title>
  <defs>
    <style><![CDATA[
      .paper { fill: #f7f6f2; }
      .ink { fill: #171817; }
      .muted { fill: #65645e; }
      .rule { stroke: #d9d7cf; }
      .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
      .label { font-size: 12px; letter-spacing: 1.5px; }
      .heading { font-size: 30px; font-weight: 500; letter-spacing: -1.3px; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #101110; }
        .ink { fill: #f1f0ec; }
        .muted { fill: #aaa9a1; }
        .rule { stroke: #343530; }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="100" class="paper" />
  <line x1="72" y1="18" x2="1128" y2="18" class="rule" stroke-width="1" />
  <text x="72" y="62" class="sans ink heading">GitHub activity &amp; streak</text>
  <text x="1128" y="60" text-anchor="end" class="mono muted label">LIVE PROFILE ACTIVITY</text>
</svg>
