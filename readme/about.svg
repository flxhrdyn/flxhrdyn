<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">About Felix</title>
  <desc id="desc">AI/ML engineer building production AI systems, deep learning architectures, and industrial data pipelines.</desc>
  <defs>
    <style><![CDATA[
      .paper { fill: #f7f6f2; }
      .ink { fill: #171817; }
      .muted { fill: #65645e; }
      .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; }
      .heading { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 38px; font-weight: 600; letter-spacing: -2px; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #101110; }
        .ink { fill: #f1f0ec; }
        .muted { fill: #aaa9a1; }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="180" class="paper" />
  <text x="72" y="70" class="ink heading">Building AI for production.</text>
  <text x="72" y="116" class="muted body">AI/ML Engineer building production AI systems, deep learning architectures, and industrial data pipelines.</text>
  <text x="72" y="146" class="muted body">Recent work spans industrial analytics, hybrid RAG, and computer vision.</text>
</svg>
