<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">About Felix</title>
  <desc id="desc">AI/ML engineer building production AI systems, deep learning architectures, and industrial data pipelines.</desc>
  <defs>
    <style><![CDATA[
      .paper { fill: #f7f6f2; }
      .ink { fill: #171817; }
      .muted { fill: #65645e; }
      .rule { stroke: #d9d7cf; }
      .sans { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
      .label { font-size: 12px; letter-spacing: 1.5px; }
      .heading { font-size: 38px; font-weight: 500; letter-spacing: -2px; }
      .body { font-size: 16px; }
      @media (prefers-color-scheme: dark) {
        .paper { fill: #101110; }
        .ink { fill: #f1f0ec; }
        .muted { fill: #aaa9a1; }
        .rule { stroke: #343530; }
      }
    ]]></style>
  </defs>
  <rect width="1200" height="250" class="paper" />
  <line x1="72" y1="20" x2="1128" y2="20" class="rule" stroke-width="1" />
  <text x="72" y="58" class="mono muted label">01 / ABOUT</text>
  <text x="72" y="112" class="sans ink heading">Building AI for production.</text>
  <text x="72" y="158" class="sans muted body">AI/ML Engineer building production AI systems, deep learning architectures, and industrial data pipelines.</text>
  <text x="72" y="188" class="sans muted body">Recent work spans industrial analytics, hybrid RAG, and computer vision.</text>
  <line x1="72" y1="220" x2="1128" y2="220" class="rule" stroke-width="1" />
</svg>
